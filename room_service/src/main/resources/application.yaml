spring:
  application:
    name: room_service
  datasource:
    url: jdbc:postgresql://localhost:5432/room_db
    username: postgres
    password: 123456
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true 

server:
  port: 8083
  eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    enabled: true    